[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "laya-mlx-service"
version = "0.1.0"
description = "Authenticated HTTP service for laya-mlx typed-decision inference"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
mlx = ["laya-mlx>=0.1.0"]
omni = [
  "laya-omni[image,audio] @ git+https://github.com/ZHEQIUSHUI/laya-omni.git@dfea79876b16c6ac9c5eafbf5d241b2359f1a4e1",
  "huggingface-hub>=0.34",
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
]

[project.scripts]
laya-service = "laya_service.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["laya_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
